[project]
name = "comfyui-animaflow"
description = "AnimaFlow: a lightweight quality-of-life node pack for the Anima model — prompt rules, prompt building, scene tools, and related helpers. Beta."
version = "0.1.0"

keywords = ["comfyui", "anima", "prompt", "webtoon", "scene", "rules"]

# Keep in sync with requirements.txt (ComfyUI-Manager installs from that file,
# the ComfyUI Registry reads this list). torch/numpy/comfy come from the ComfyUI
# environment and are intentionally not pinned in either place.
dependencies = ["pyyaml>=6.0"]

# Keep in sync with requirements-dev.txt. Test-only: `jsonschema` is used by
# tests/test_ruleset_schema.py to cross-check prompt-rules/ruleset.schema.json
# against a real JSON Schema implementation; it is never imported by shipped
# code and must never be installed for a plain ComfyUI user (hence it lives
# here, not in `dependencies` above). Install with `pip install -e .[dev]`.
[project.optional-dependencies]
dev = ["jsonschema>=4.18", "pyyaml>=6.0"]

[project.urls]
Repository = "https://github.com/IgorSokolovsky/ComfyUI-AnimaFlow"

[tool.comfy]
DisplayName = "AnimaFlow"
